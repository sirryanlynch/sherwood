name: Deploy Firebase

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync county adapters
        run: node backend/scripts/sync-counties.mjs
      - name: Deploy rules and functions
        working-directory: backend
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT or FIREBASE_PROJECT_ID is not set. Skipping Firebase deploy."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npm --prefix functions ci
          npx --yes firebase-tools@13.29.1 deploy --only firestore:rules,firestore:indexes,functions --project "$FIREBASE_PROJECT_ID" --non-interactive
